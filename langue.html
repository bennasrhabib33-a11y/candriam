<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Langue / Language / Idioma / Sprache — Candriam Business Investissement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --primary: #FF5A36;
  --primary-dark: #E0431F;
  --primary-tint: #FFE9E2;
  --ink: #161A2B;
  --ink-soft: #4A4E63;
  --paper: #FFFFFF;
  --paper-deep: #F4F5FB;
  --line: #E7E8F2;
  --muted: #767A8F;
  --sage: #16A06A;
  --sage-tint: #E1F7EC;
  --gold: #FFB23E;
  --blue: #2F5BFF;
  --radius: 20px;
  --radius-pill: 999px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Plus Jakarta Sans", sans-serif;
  background:var(--paper-deep);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---- Header minimal ---- */
.topbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:.7em;text-decoration:none;color:var(--ink);}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(155deg,#FF5A36,#FFB23E);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1rem;color:#fff;flex:none;
}
.brand-name{font-weight:800;font-size:1rem;line-height:1.2;}
.brand-name span{display:block;font-size:.62rem;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;font-weight:600;}
.back-link{
  display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;
  color:var(--ink-soft);text-decoration:none;
  border:2px solid var(--line);padding:9px 18px;border-radius:var(--radius-pill);
  transition:all .15s ease;
}
.back-link:hover{border-color:var(--primary);color:var(--primary);}

/* ---- Contenu principal ---- */
.main{flex:1;padding:56px 28px 80px;max-width:900px;margin:0 auto;width:100%;}

.page-title{
  font-weight:800;font-size:clamp(1.8rem,3.5vw,2.6rem);
  letter-spacing:-0.02em;line-height:1.1;margin-bottom:8px;
}
.page-sub{color:var(--muted);font-size:1rem;margin-bottom:44px;}

/* ---- Grille de langues ---- */
.lang-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:16px;margin-bottom:48px;
}
.lang-card{
  background:#fff;border:2px solid var(--line);border-radius:var(--radius);
  padding:26px 24px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  position:relative;
}
.lang-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:0 18px 40px -20px rgba(255,90,54,.3);}
.lang-card.selected{
  border-color:var(--primary);
  background:var(--primary-tint);
  box-shadow:0 18px 40px -20px rgba(255,90,54,.35);
}
.lang-flag{font-size:2.6rem;line-height:1;}
.lang-native{font-weight:800;font-size:1.15rem;}
.lang-english{font-size:.84rem;color:var(--muted);font-weight:600;}
.lang-check{
  position:absolute;top:14px;right:14px;
  width:26px;height:26px;border-radius:50%;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.6);transition:opacity .18s ease, transform .18s ease;
}
.lang-check svg{width:13px;height:13px;}
.lang-card.selected .lang-check{opacity:1;transform:scale(1);}

/* ---- Aperçu live ---- */
.preview-box{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin-bottom:40px;
}
.preview-head{
  padding:18px 24px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  background:var(--paper-deep);
}
.preview-head .dot{width:11px;height:11px;border-radius:50%;}
.preview-label{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
.preview-content{padding:30px 32px;}
.preview-eyebrow{
  font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--primary);display:flex;align-items:center;gap:.5em;margin-bottom:10px;
}
.preview-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);}
.preview-h1{font-weight:800;font-size:1.6rem;letter-spacing:-0.02em;margin-bottom:10px;line-height:1.2;}
.preview-lede{color:var(--ink-soft);font-size:.95rem;line-height:1.6;margin-bottom:20px;max-width:52ch;}
.preview-btns{display:flex;gap:10px;flex-wrap:wrap;}
.preview-btn-p{
  background:var(--primary);color:#fff;border:none;
  padding:12px 22px;border-radius:var(--radius-pill);font-family:inherit;font-weight:800;font-size:.88rem;
  cursor:pointer;
}
.preview-btn-o{
  background:transparent;color:var(--ink);border:2px solid var(--ink);
  padding:10px 20px;border-radius:var(--radius-pill);font-family:inherit;font-weight:800;font-size:.88rem;
  cursor:pointer;
}
.preview-stats{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:22px;
}
.preview-stat{
  background:var(--paper-deep);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;min-width:100px;
}
.preview-stat strong{display:block;font-size:1.4rem;font-weight:800;color:var(--primary);}
.preview-stat span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);}

/* ---- Bouton confirmer ---- */
.confirm-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.confirm-note{font-size:.85rem;color:var(--muted);}
.confirm-note strong{color:var(--ink);}
.btn-confirm{
  background:var(--primary);color:#fff;border:none;
  padding:16px 36px;border-radius:var(--radius-pill);font-family:inherit;font-weight:800;font-size:1rem;
  cursor:pointer;box-shadow:0 12px 26px -10px rgba(255,90,54,.55);
  transition:all .18s ease;display:flex;align-items:center;gap:8px;
}
.btn-confirm:hover{background:var(--primary-dark);transform:translateY(-2px);}

/* ---- Toast ---- */
.toast{
  position:fixed;bottom:28px;right:28px;
  background:var(--ink);color:#fff;
  padding:16px 24px;border-radius:16px;
  font-weight:700;font-size:.92rem;
  box-shadow:0 20px 50px -20px rgba(22,26,43,.5);
  display:flex;align-items:center;gap:10px;
  transform:translateY(80px);opacity:0;
  transition:transform .3s ease, opacity .3s ease;
  z-index:100;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast .t-icon{
  width:28px;height:28px;border-radius:50%;background:var(--sage);
  display:flex;align-items:center;justify-content:center;flex:none;
}

@media (max-width:560px){
  .lang-grid{grid-template-columns:1fr 1fr;}
  .main{padding:36px 20px 60px;}
  .preview-content{padding:22px 20px;}
  .preview-h1{font-size:1.25rem;}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">
    <span class="brand-mark">FA</span>
    <span class="brand-name">Candriam Business<br>Investissement<span>Établissement de crédit</span></span>
  </a>
  <a href="index.html" class="back-link">
    ← <span id="back-text">Retour au site</span>
  </a>
</header>

<main class="main">

  <p class="page-title" id="page-title">Choisissez votre langue</p>
  <p class="page-sub" id="page-sub">La langue sera mémorisée et appliquée sur toutes les pages du site.</p>

  <div class="lang-grid" id="lang-grid"></div>

  <!-- Aperçu live -->
  <div class="preview-box">
    <div class="preview-head">
      <span class="dot" style="background:#FF5A36;"></span>
      <span class="dot" style="background:#FFB23E;margin-left:6px;"></span>
      <span class="dot" style="background:#16A06A;margin-left:6px;"></span>
      <span class="preview-label" id="preview-label">Aperçu</span>
    </div>
    <div class="preview-content">
      <p class="preview-eyebrow" id="prev-eyebrow"></p>
      <h2 class="preview-h1" id="prev-h1"></h2>
      <p class="preview-lede" id="prev-lede"></p>
      <div class="preview-btns">
        <button class="preview-btn-p" id="prev-cta1"></button>
        <button class="preview-btn-o" id="prev-cta2"></button>
      </div>
      <div class="preview-stats">
        <div class="preview-stat"><strong id="prev-s1v"></strong><span id="prev-s1l"></span></div>
        <div class="preview-stat"><strong id="prev-s2v"></strong><span id="prev-s2l"></span></div>
        <div class="preview-stat"><strong id="prev-s3v"></strong><span id="prev-s3l"></span></div>
      </div>
    </div>
  </div>

  <div class="confirm-row">
    <p class="confirm-note">
      Langue sélectionnée&nbsp;: <strong id="confirm-lang-name">Français</strong>
    </p>
    <button class="btn-confirm" id="btn-confirm" onclick="applyAndGo()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="confirm-text">Confirmer et revenir</span>
    </button>
  </div>
</main>

<div class="toast" id="toast">
  <div class="t-icon">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <span id="toast-msg">Langue enregistrée !</span>
</div>

<script src="assets/lang.js"></script>
<script>
const LANGS = [
  { code:"fr", flag:"🇫🇷", native:"Français",   english:"French",  region:"France" },
  { code:"en", flag:"🇬🇧", native:"English",    english:"English", region:"United Kingdom" },
  { code:"es", flag:"🇪🇸", native:"Español",    english:"Spanish", region:"España" },
  { code:"de", flag:"🇩🇪", native:"Deutsch",    english:"German",  region:"Deutschland" },
];

const UI_LABELS = {
  fr:{ title:"Choisissez votre langue", sub:"La langue sera mémorisée et appliquée sur toutes les pages du site.", preview:"Aperçu", back:"Retour au site", confirm:"Confirmer et revenir", saved:"Langue enregistrée !", selected:"Langue sélectionnée" },
  en:{ title:"Choose your language",    sub:"Your choice will be saved and applied across all pages.",              preview:"Preview", back:"Back to site",   confirm:"Confirm & go back",   saved:"Language saved!",     selected:"Selected language" },
  es:{ title:"Elige tu idioma",         sub:"Tu elección se guardará y se aplicará en todas las páginas.",          preview:"Vista previa", back:"Volver al sitio", confirm:"Confirmar y volver", saved:"¡Idioma guardado!",  selected:"Idioma seleccionado" },
  de:{ title:"Sprache wählen",          sub:"Ihre Wahl wird gespeichert und auf allen Seiten angewendet.",          preview:"Vorschau",  back:"Zurück zur Website", confirm:"Bestätigen & zurück", saved:"Sprache gespeichert!", selected:"Gewählte Sprache" },
};

let chosen = localStorage.getItem("fai_lang") || "fr";

function buildGrid() {
  const grid = document.getElementById("lang-grid");
  grid.innerHTML = "";
  LANGS.forEach(l => {
    const card = document.createElement("div");
    card.className = "lang-card" + (l.code === chosen ? " selected" : "");
    card.dataset.code = l.code;
    card.innerHTML = `
      <span class="lang-flag">${l.flag}</span>
      <span class="lang-native">${l.native}</span>
      <span class="lang-english">${l.english} · ${l.region}</span>
      <span class="lang-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
    `;
    card.addEventListener("click", () => select(l.code));
    grid.appendChild(card);
  });
}

function updateUI(code) {
  const ui = UI_LABELS[code] || UI_LABELS.fr;
  const t  = TRANSLATIONS[code] || TRANSLATIONS.fr;
  const l  = LANGS.find(x => x.code === code);

  document.getElementById("page-title").textContent    = ui.title;
  document.getElementById("page-sub").textContent      = ui.sub;
  document.getElementById("preview-label").textContent = ui.preview;
  document.getElementById("back-text").textContent     = ui.back;
  document.getElementById("confirm-text").textContent  = ui.confirm;
  document.getElementById("toast-msg").textContent     = ui.saved;
  document.getElementById("confirm-lang-name").textContent = `${l.flag} ${l.native}`;

  document.getElementById("prev-eyebrow").textContent  = t.hero_eyebrow || "";
  document.getElementById("prev-h1").textContent       = t.hero_h1 || "";
  document.getElementById("prev-lede").textContent     = t.hero_lede || "";
  document.getElementById("prev-cta1").textContent     = t.hero_cta1 || "";
  document.getElementById("prev-cta2").textContent     = t.hero_cta2 || "";
  document.getElementById("prev-s1v").textContent      = t.hero_stat1_val || "";
  document.getElementById("prev-s1l").textContent      = t.hero_stat1_lbl || "";
  document.getElementById("prev-s2v").textContent      = t.hero_stat2_val || "";
  document.getElementById("prev-s2l").textContent      = t.hero_stat2_lbl || "";
  document.getElementById("prev-s3v").textContent      = t.hero_stat3_val || "";
  document.getElementById("prev-s3l").textContent      = t.hero_stat3_lbl || "";
}

function select(code) {
  chosen = code;
  document.querySelectorAll(".lang-card").forEach(c => {
    c.classList.toggle("selected", c.dataset.code === code);
  });
  updateUI(code);
}

function applyAndGo() {
  localStorage.setItem("fai_lang", chosen);
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
  setTimeout(() => window.location.href = "index.html", 1100);
}

buildGrid();
updateUI(chosen);
</script>
</body>
</html>
